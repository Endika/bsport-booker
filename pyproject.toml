[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bsport-booker"
version = "0.1.0"
description = "Books your bsport classes on its own as soon as they can be booked"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
bsport-booker = "bsport_booker.cli:main"

[tool.setuptools]
packages = [
    "bsport_booker",
    "bsport_booker.adapters",
    "bsport_booker.adapters.bsport",
    "bsport_booker.application",
    "bsport_booker.domain",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH", "RUF"]
# The Slack messages are Spanish and use emoji and en dashes on purpose.
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["bsport_booker", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
