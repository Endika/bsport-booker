[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bsport-booker"
version = "0.0.0"
description = "Reserva sola tus clases de bsport en cuanto se pueden reservar"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
bsport-booker = "bsport_booker.cli:main"

[tool.setuptools]
packages = ["bsport_booker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH", "RUF"]
# The Slack messages are Spanish and use emoji and en dashes on purpose.
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["bsport_booker", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
